services:

  # ============================================================
  # BASE DE DONNÉES POSTGRESQL
  # ============================================================
  db:
    image: postgres:15
    container_name: ma_base_de_donnees
    restart: unless-stopped
    environment:
      POSTGRES_USER: Naouel
      POSTGRES_PASSWORD: Pino2026
      POSTGRES_DB: sentiment_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Naouel -d sentiment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentiment_net

  # ============================================================
  # REDIS (file de tâches pour le worker)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: cache_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentiment_net

  # ============================================================
  # MINIO (stockage objet pour les splits de données)
  # ============================================================
  minio:
    image: pgsty/minio:latest
    container_name: stockage_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - sentiment_net

  # ============================================================
  # BACKEND FastAPI (API + BERT synchrone)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mon_code_python
    restart: unless-stopped
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=Naouel
      - DB_PASSWORD=Pino2026
      - DB_NAME=sentiment_db
      - SECRET_KEY=changer_cette_cle_en_production
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/app
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sentiment_net

  # ============================================================
  # WORKER (analyse BERT en arrière-plan via Redis)
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mon_worker
    restart: unless-stopped
    command: python worker.py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=Naouel
      - DB_PASSWORD=Pino2026
      - DB_NAME=sentiment_db
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/app
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sentiment_net

  # ============================================================
  # FRONTEND (Nginx - interface web)
  # ============================================================
  frontend:
    image: nginx:alpine
    container_name: mon_interface_web
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sentiment_net

# ============================================================
# VOLUMES PERSISTANTS
# ============================================================
volumes:
  postgres_data:
  redis_data:
  minio_data:

# ============================================================
# RÉSEAU INTERNE
# ============================================================
networks:
  sentiment_net:
    driver: bridge
