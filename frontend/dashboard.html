<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - SentimentFlow</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0A0D1A;
            --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.07);
            --text: #EAEDF5;
            --muted: #8892A8;
            --primary: #6C63FF;
            --secondary: #FF6584;
            --radius: 20px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 30px 20px;
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(108,99,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(255,101,132,0.04) 0%, transparent 60%);
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .dash-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 24px 32px; background: var(--card);
            backdrop-filter: blur(20px); border-radius: var(--radius);
            border: 1px solid var(--border); margin-bottom: 32px;
            flex-wrap: wrap; gap: 16px;
        }
        .dash-header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
        .dash-header h1 span { color: var(--secondary); }

        .header-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

        .nav-link {
            color: var(--text); text-decoration: none;
            font-size: 14px; font-weight: 500;
            padding: 8px 16px; border-radius: 100px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        .header-actions .update-time { color: var(--muted); font-size: 14px; }

        .btn-refresh {
            padding: 10px 24px; background: var(--primary);
            border: none; border-radius: 12px; color: #fff;
            font-weight: 600; cursor: pointer; transition: all 0.3s;
            font-size: 14px;
        }
        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(108,99,255,0.3);
        }

        /* STATS */
        .stats-dash {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 16px; margin-bottom: 32px;
        }
        .stat-item {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 24px 20px;
            text-align: center; transition: all 0.3s;
        }
        .stat-item .num { font-size: 38px; font-weight: 800; letter-spacing: -1px; }
        .stat-item .lbl { color: var(--muted); font-size: 14px; margin-top: 4px; }
        .stat-item.green .num { color: #4ECB8D; }
        .stat-item.red .num { color: #E8607A; }
        .stat-item.yellow .num { color: #FFD93D; }
        .stat-item.blue .num { color: #64B5F6; }

        /* GRAPHIQUE */
        .chart-single {
            max-width: 500px; margin: 0 auto 32px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 24px;
        }
        .chart-single h3 {
            font-size: 16px; font-weight: 600;
            color: var(--muted); margin-bottom: 16px;
            text-align: center;
        }
        .chart-single .chart-wrap { height: 320px; }

        /* SECTION RECHERCHES */
        .searches-section {
            margin-bottom: 32px;
        }
        .searches-section > h2 {
            font-size: 20px; font-weight: 700;
            margin-bottom: 20px; color: #fff;
            display: flex; align-items: center; gap: 10px;
        }
        .searches-section > h2 .count-badge {
            background: var(--primary);
            color: #fff; padding: 4px 14px;
            border-radius: 100px; font-size: 14px; font-weight: 600;
        }

        /* CARTE RECHERCHE */
        .search-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 20px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .search-card:hover {
            border-color: rgba(108,99,255,0.3);
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: rgba(108,99,255,0.06);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }
        .search-header .left {
            display: flex; align-items: center; gap: 14px;
            flex-wrap: wrap;
        }
        .search-header .keyword {
            font-size: 18px; font-weight: 700; color: #fff;
        }
        .search-header .search-id {
            color: var(--muted); font-size: 13px;
        }

        .badge {
            padding: 4px 14px; border-radius: 100px;
            font-size: 12px; font-weight: 600;
        }
        .badge.completed { background: rgba(78,203,141,0.15); color: #4ECB8D; }
        .badge.pending   { background: rgba(255,217,61,0.15); color: #FFD93D; }
        .badge.failed    { background: rgba(232,96,122,0.15); color: #E8607A; }

        .search-header .right {
            display: flex; align-items: center; gap: 16px;
            color: var(--muted); font-size: 13px;
        }

        /* PRÉDICTIONS */
        .predictions-container {
            padding: 16px 24px 20px;
        }
        .prediction-row {
            display: grid;
            grid-template-columns: 60px 1fr 120px 90px;
            gap: 16px;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .prediction-row:last-child { border-bottom: none; }

        .prediction-row .num {
            color: var(--muted); font-size: 13px;
            font-weight: 600;
        }
        .prediction-row .text {
            color: rgba(255,255,255,0.9);
            font-size: 14px;
            line-height: 1.5;
        }
        .prediction-row .sentiment {
            text-align: center;
        }
        .prediction-row .score {
            text-align: right;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            color: #FFD93D;
            font-weight: 600;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px; border-radius: 100px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tag.pos { background: rgba(78,203,141,0.15); color: #4ECB8D; }
        .tag.neg { background: rgba(232,96,122,0.15); color: #E8607A; }
        .tag.neu { background: rgba(255,217,61,0.15); color: #FFD93D; }

        .empty-predictions {
            padding: 20px 24px;
            color: var(--muted); font-size: 13px;
            text-align: center;
        }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; }

        @media (max-width: 900px) {
            .prediction-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .prediction-row .score { text-align: left; }
            .prediction-row .sentiment { text-align: left; }
        }
        @media (max-width: 768px) {
            .stats-dash { grid-template-columns: repeat(2, 1fr); }
            .dash-header { flex-direction: column; align-items: stretch; text-align: center; }
            .header-actions { justify-content: center; flex-wrap: wrap; }
            .chart-single { max-width: 100%; }
            .search-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dash-header">
            <h1>📊 <span>Tableau de bord</span> • Analyse en temps réel</h1>
            <div class="header-actions">
                <a href="index.html" class="nav-link">🏠 Accueil</a>
                <a href="admin.html" class="nav-link">⚙️ Admin</a>
                <span class="update-time" id="lastUpdate">⏳ Chargement...</span>
                <button class="btn-refresh" onclick="loadAll()">🔄 Actualiser</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-dash">
            <div class="stat-item green"><div class="num" id="dashPos">0</div><div class="lbl">✅ Positifs</div></div>
            <div class="stat-item red"><div class="num" id="dashNeg">0</div><div class="lbl">❌ Négatifs</div></div>
            <div class="stat-item yellow"><div class="num" id="dashNeu">0</div><div class="lbl">⚪ Neutres</div></div>
            <div class="stat-item blue"><div class="num" id="dashTot">0</div><div class="lbl">📊 Total prédictions</div></div>
        </div>

        <!-- GRAPHIQUE -->
        <div class="chart-single">
            <h3>🎯 Répartition des sentiments</h3>
            <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
        </div>

        <!-- RECHERCHES + PRÉDICTIONS -->
        <div class="searches-section">
            <h2>
                🔍 Recherches et leurs prédictions
                <span class="count-badge" id="searchCount">0</span>
            </h2>
            <div id="searchesContainer">
                <div class="empty-state">
                    <span class="icon">🔍</span>
                    Aucune recherche enregistrée
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8002";
        let chartPie = null;

        async function loadAll() {
            document.getElementById('lastUpdate').textContent = '⏳ Chargement...';
            await Promise.all([loadStats(), loadSearchesWithPredictions()]);
            document.getElementById('lastUpdate').textContent = '🟢 ' + new Date().toLocaleTimeString();
        }

        // ============ STATS ============
        async function loadStats() {
            try {
                const res = await fetch(`${API_URL}/stats`);
                const data = await res.json();
                if (!data || data.total === undefined) return;

                const total = data.total || 0;
                const repartition = data.repartition || [];
                let pos = 0, neg = 0, neu = 0;
                repartition.forEach(item => {
                    if (item.sentiment === 'POSITIVE') pos = item.count || 0;
                    else if (item.sentiment === 'NEGATIVE') neg = item.count || 0;
                    else neu = item.count || 0;
                });

                document.getElementById('dashPos').textContent = pos;
                document.getElementById('dashNeg').textContent = neg;
                document.getElementById('dashNeu').textContent = neu;
                document.getElementById('dashTot').textContent = total;

                renderChart(pos, neg, neu);
            } catch (e) {
                console.error('Erreur stats:', e);
            }
        }

        // ============ RECHERCHES + PRÉDICTIONS ============
        async function loadSearchesWithPredictions() {
            const container = document.getElementById('searchesContainer');
            try {
                // 1. Récupérer les recherches
                const res = await fetch(`${API_URL}/recherches?limit=20`);
                const data = await res.json();
                const searches = data.data || [];

                document.getElementById('searchCount').textContent = searches.length;

                if (searches.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">🔍</span>
                            Aucune recherche enregistrée.<br>
                            Lancez une analyse depuis <a href="index.html" style="color:#6C63FF;">l'accueil</a>.
                        </div>
                    `;
                    return;
                }

                // 2. Pour chaque recherche, récupérer ses prédictions
                const enrichedSearches = await Promise.all(
                    searches.map(async (s) => {
                        try {
                            const pRes = await fetch(`${API_URL}/recherches/${s.id}/predictions`);
                            const pData = await pRes.json();
                            return { ...s, predictions: pData.data || [] };
                        } catch {
                            return { ...s, predictions: [] };
                        }
                    })
                );

                // 3. Construire le HTML
                let html = '';
                enrichedSearches.forEach(s => {
                    const date = new Date(s.created_at).toLocaleString('fr-FR');
                    const badgeClass = s.status === 'completed' ? 'completed'
                                     : s.status === 'failed' ? 'failed' : 'pending';
                    const badgeLabel = s.status === 'completed' ? '✅ Complétée'
                                     : s.status === 'failed' ? '❌ Échouée' : '⏳ En cours';

                    html += `
                        <div class="search-card">
                            <div class="search-header">
                                <div class="left">
                                    <span class="keyword">🔎 ${s.keyword}</span>
                                    <span class="search-id">Recherche #${s.id}</span>
                                    <span class="badge ${badgeClass}">${badgeLabel}</span>
                                </div>
                                <div class="right">
                                    <span>📊 ${s.predictions.length} prédiction(s)</span>
                                    <span>🕐 ${date}</span>
                                </div>
                            </div>
                    `;

                    if (s.predictions.length === 0) {
                        html += `<div class="empty-predictions">Aucune prédiction pour cette recherche</div>`;
                    } else {
                        html += `<div class="predictions-container">`;
                        s.predictions.forEach((p, idx) => {
                            const sent = (p.sentiment || 'NEUTRAL').toUpperCase();
                            const cls = sent === 'POSITIVE' ? 'pos'
                                      : sent === 'NEGATIVE' ? 'neg' : 'neu';
                            const label = sent === 'POSITIVE' ? 'POS'
                                        : sent === 'NEGATIVE' ? 'NEG' : 'NEU';
                            const score = p.sentiment_score != null
                                        ? Number(p.sentiment_score).toFixed(2)
                                        : '—';

                            html += `
                                <div class="prediction-row">
                                    <div class="num">#${idx + 1}</div>
                                    <div class="text">${p.text || '—'}</div>
                                    <div class="sentiment"><span class="tag ${cls}">${label}</span></div>
                                    <div class="score">${score}</div>
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }

                    html += `</div>`;
                });

                container.innerHTML = html;

            } catch (e) {
                console.error('Erreur recherches:', e);
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">⚠️</span>
                        Erreur de chargement
                    </div>
                `;
            }
        }

        // ============ GRAPHIQUE ============
        function renderChart(pos, neg, neu) {
            const ctxPie = document.getElementById('pieChart').getContext('2d');
            if (chartPie) chartPie.destroy();
            chartPie = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: ['Positifs', 'Négatifs', 'Neutres'],
                    datasets: [{
                        data: [pos, neg, neu],
                        backgroundColor: ['#4ECB8D','#E8607A','#FFD93D'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#EAEDF5', padding: 16, font: { size: 14 } }
                        }
                    }
                }
            });
        }

        // ============ DÉMARRAGE ============
        loadAll();
        setInterval(loadAll, 30000);
    </script>
</body>
</html>
