<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentimentFlow - Analyseur d'opinions</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52D5;
            --secondary: #FF6584;
            --bg-dark: #0B0E1A;
            --bg-card: rgba(255,255,255,0.04);
            --text: #E8EAF6;
            --text-muted: #9EA3B8;
            --glass: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.08);
            --shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            --radius: 24px;
            --radius-sm: 14px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(108, 99, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 101, 132, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(108, 99, 255, 0.03) 0%, transparent 70%);
        }

        .container { max-width: 1200px; width: 100%; }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 48px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }
        .logo-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 60%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-text span { color: var(--secondary); -webkit-text-fill-color: var(--secondary); }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .badge-status {
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge-status.online {
            background: rgba(76, 203, 141, 0.15);
            color: #4ECB8D;
            border: 1px solid rgba(76, 203, 141, 0.25);
        }
        .badge-status.online::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #4ECB8D;
            border-radius: 50%;
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .badge-status.offline {
            background: rgba(232, 96, 122, 0.15);
            color: #E8607A;
            border: 1px solid rgba(232, 96, 122, 0.25);
        }
        .badge-status.offline::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #E8607A;
            border-radius: 50%;
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            padding: 40px 20px 48px;
        }
        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 12px;
        }
        .hero h1 .highlight {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: var(--text-muted);
            font-size: 18px;
            max-width: 540px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }

        /* ===== SEARCH ===== */
        .search-wrapper {
            max-width: 720px;
            margin: 0 auto 40px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 12px;
            border: 1px solid var(--border);
            transition: all 0.4s ease;
        }
        .search-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.15);
        }
        .search-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-row input {
            flex: 1;
            padding: 16px 20px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
            outline: none;
        }
        .search-row input::placeholder { color: var(--text-muted); }
        .search-row select {
            padding: 16px 20px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 15px;
            cursor: pointer;
            outline: none;
            appearance: none;
            min-width: 130px;
        }
        .search-row select option { background: #1A1E2F; }

        .btn-search {
            padding: 16px 36px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }
        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(108, 99, 255, 0.35);
        }
        .btn-search:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message-box {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            margin-top: 16px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }
        .message-box.error {
            display: block;
            background: rgba(232, 96, 122, 0.12);
            color: #E8607A;
            border: 1px solid rgba(232, 96, 122, 0.15);
        }
        .message-box.success {
            display: block;
            background: rgba(76, 203, 141, 0.12);
            color: #4ECB8D;
            border: 1px solid rgba(76, 203, 141, 0.15);
        }
        .message-box.info {
            display: block;
            background: rgba(255, 217, 61, 0.08);
            color: #FFD93D;
            border: 1px solid rgba(255, 217, 61, 0.12);
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
            display: none;
        }
        .stats-grid.active { display: grid; }

        .stat-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 22px 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        .stat-card .number {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .stat-card .label {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }
        .stat-card.pos .number { color: #4ECB8D; }
        .stat-card.neg .number { color: #E8607A; }
        .stat-card.neu .number { color: #FFD93D; }
        .stat-card.tot .number { color: #64B5F6; }

        /* ===== CHART ===== */
        .chart-box {
            max-width: 400px;
            margin: 0 auto 28px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 24px;
            display: none;
        }
        .chart-box.active { display: block; }

        /* ===== RESULTS ===== */
        .results-section {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 32px;
            margin-top: 24px;
            display: none;
        }
        .results-section.active { display: block; }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .results-header h2 {
            font-size: 20px;
            font-weight: 600;
        }
        .results-header .count {
            color: var(--text-muted);
            font-size: 14px;
            background: var(--glass);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid var(--border);
        }

        .result-item {
            background: rgba(255,255,255,0.03);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            margin-bottom: 10px;
            border-left: 4px solid var(--text-muted);
            transition: all 0.3s ease;
        }
        .result-item:hover {
            background: rgba(255,255,255,0.06);
            transform: translateX(4px);
        }
        .result-item.positive { border-left-color: #4ECB8D; }
        .result-item.negative { border-left-color: #E8607A; }
        .result-item.neutral { border-left-color: #FFD93D; }

        .result-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .result-text {
            flex: 1;
            font-size: 15px;
            line-height: 1.5;
            color: rgba(255,255,255,0.9);
        }
        .result-sentiment {
            padding: 4px 16px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .result-sentiment.positive {
            background: rgba(76, 203, 141, 0.15);
            color: #4ECB8D;
        }
        .result-sentiment.negative {
            background: rgba(232, 96, 122, 0.15);
            color: #E8607A;
        }
        .result-sentiment.neutral {
            background: rgba(255, 217, 61, 0.15);
            color: #FFD93D;
        }

        .result-bottom {
            display: flex;
            gap: 20px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }
        .empty-state .emoji { font-size: 48px; margin-bottom: 12px; display: block; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 16px; padding: 20px; }
            .header-actions { width: 100%; justify-content: center; }
            .hero h1 { font-size: 32px; }
            .search-row { flex-wrap: wrap; }
            .search-row input { min-width: 100%; }
            .search-row select { flex: 1; min-width: 0; }
            .btn-search { width: 100%; justify-content: center; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .results-section { padding: 20px; }
            .result-top { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <a class="logo" href="#">
                <div class="logo-icon">◆</div>
                <span class="logo-text"><span>Analyseur</span> des sentiment</span>
            </a>
            <div class="header-actions">
                <span class="badge-status online" id="badge-api">Service actif</span>
            </div>
        </header>

        <!-- HERO -->
        <section class="hero">
            <h1>Découvrez ce que les visiteurs <span class="highlight">pensent vraiment</span></h1>
            <p>Analysez les avis en temps réel. </p>
        </section>

        <!-- SEARCH -->
        <div class="search-wrapper">
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="Ex: Mytek, Tunisie, Restaurant..." />
                <select id="limitSelect">
                    <option value="5">5 avis</option>
                    <option value="10" selected>10 avis</option>
                    <option value="15">15 avis</option>
                    <option value="20">20 avis</option>
                </select>
                <button class="btn-search" id="searchBtn">🔍 Analyser</button>
            </div>
            <div id="message" class="message-box"></div>
        </div>

        <!-- STATS -->
        <div class="stats-grid" id="statsContainer">
            <div class="stat-card pos"><div class="number" id="statPositive">0</div><div class="label">✅ Positifs</div></div>
            <div class="stat-card neg"><div class="number" id="statNegative">0</div><div class="label">❌ Négatifs</div></div>
            <div class="stat-card neu"><div class="number" id="statNeutral">0</div><div class="label">⚪ Neutres</div></div>
            <div class="stat-card tot"><div class="number" id="statTotal">0</div><div class="label">📊 Total</div></div>
        </div>

        <!-- CHART -->
        <div class="chart-box" id="chartContainer">
            <canvas id="sentimentChart"></canvas>
        </div>

        <!-- RESULTS -->
        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <h2 id="resultTitle">📝 Résultats</h2>
                <span class="count" id="resultCount">0 avis</span>
            </div>
            <div id="resultsList">
                <div class="empty-state"><span class="emoji">🔍</span>Aucun résultat pour le moment</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8002";
        let chartInstance = null;

        // DOM refs
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const limitSelect = document.getElementById('limitSelect');
        const message = document.getElementById('message');
        const resultsList = document.getElementById('resultsList');
        const resultsSection = document.getElementById('resultsSection');
        const statsContainer = document.getElementById('statsContainer');
        const chartContainer = document.getElementById('chartContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultCount = document.getElementById('resultCount');

        function showMessage(type, text) {
            message.className = 'message-box ' + type;
            message.textContent = text;
        }

        function hideMessage() {
            message.className = 'message-box';
            message.textContent = '';
        }

        async function checkAPI() {
            try {
                const res = await fetch(`${API_URL}/`);
                if (res.ok) {
                    document.getElementById('badge-api').className = 'badge-status online';
                    document.getElementById('badge-api').textContent = 'Service actif';
                }
            } catch {
                document.getElementById('badge-api').className = 'badge-status offline';
                document.getElementById('badge-api').textContent = 'Hors ligne';
                showMessage('error', 'Impossible de contacter le serveur. Vérifiez que l\'API est démarrée.');
            }
        }

        async function rechercher() {
            const motCle = searchInput.value.trim();
            if (!motCle) {
                showMessage('error', 'Veuillez saisir un mot-clé');
                return;
            }

            hideMessage();
            searchBtn.disabled = true;
            searchBtn.textContent = '⏳ Analyse...';

            try {
                const limit = limitSelect.value;
                const url = `${API_URL}/recherche_avis?mot_cle=${encodeURIComponent(motCle)}&limit=${limit}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.total === 0) {
                    showMessage('info', `Aucun avis trouvé pour "${motCle}"`);
                    resultsSection.classList.remove('active');
                    statsContainer.classList.remove('active');
                    chartContainer.classList.remove('active');
                    return;
                }

                renderResults(data, motCle);

            } catch (error) {
                showMessage('error', `Erreur: ${error.message}`);
                console.error(error);
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 Analyser';
            }
        }

        function renderResults(data, motCle) {
            const items = data.data || [];
            const total = data.total || 0;

            let positifs = 0, negatifs = 0, neutres = 0;
            items.forEach(item => {
                const s = (item.sentiment || '').toUpperCase();
                if (s === 'POSITIVE') positifs++;
                else if (s === 'NEGATIVE') negatifs++;
                else neutres++;
            });

            document.getElementById('statPositive').textContent = positifs;
            document.getElementById('statNegative').textContent = negatifs;
            document.getElementById('statNeutral').textContent = neutres;
            document.getElementById('statTotal').textContent = total;
            statsContainer.classList.add('active');

            renderChart(positifs, negatifs, neutres);

            resultTitle.textContent = `📝 Résultats pour "${motCle}"`;
            resultCount.textContent = `${total} avis`;

            let html = '';
            items.forEach(avis => {
                const s = (avis.sentiment || '').toUpperCase();
                const cls = s.toLowerCase();
                const emoji = s === 'POSITIVE' ? '😊' : s === 'NEGATIVE' ? '😡' : '😐';
                const note = avis.note || 'N/A';
                const auteur = avis.auteur || 'Anonyme';
                const score = avis.confidence || 0;

                html += `
                    <div class="result-item ${cls}">
                        <div class="result-top">
                            <span class="result-text">${avis.text || ''}</span>
                            <span class="result-sentiment ${cls}">${emoji} ${s}</span>
                        </div>
                        <div class="result-bottom">
                            <span>⭐ ${note}</span>
                            <span>👤 ${auteur}</span>
                            <span>📊 Score: ${(score).toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });

            resultsList.innerHTML = html;
            resultsSection.classList.add('active');
        }

        function renderChart(positifs, negatifs, neutres) {
            chartContainer.classList.add('active');
            const ctx = document.getElementById('sentimentChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Positifs', 'Négatifs', 'Neutres'],
                    datasets: [{
                        data: [positifs, negatifs, neutres],
                        backgroundColor: ['#4ECB8D', '#E8607A', '#FFD93D'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            labels: { color: 'rgba(255,255,255,0.8)', padding: 16, font: { size: 14 } }
                        }
                    }
                }
            });
        }

        // Events
        searchBtn.addEventListener('click', rechercher);
        searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') rechercher(); });

        checkAPI();
    </script>
</body>
</html>
